<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>@@PAGE_TITLE@@</title>
<style>
:root{--ink:#19343d;--muted:#637780;--accent:#176a70;--stroke:#dce4e7;--paper:#fff;--back:#f2f5f6;--display:"Songti SC","STSong",serif;--body:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;--mono:"SFMono-Regular",Consolas,monospace;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--back);color:var(--ink);font:14px/1.75 var(--body)}button,input,select{font:inherit}button,select{cursor:pointer}button{color:inherit}button:disabled{cursor:default;opacity:.4}button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible,.segment:focus-visible,summary:focus-visible{outline:3px solid #207c99;outline-offset:3px}button{border:1px solid var(--stroke);border-radius:7px;background:var(--paper);padding:6px 11px}button:hover:not(:disabled){background:#edf4f5}a{color:var(--accent);text-underline-offset:3px}.app{height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr);padding:0 26px 18px;gap:14px}.masthead{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:20px}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--accent);font-weight:700}.masthead h1{font:600 26px/1.3 var(--display);margin:4px 0 0}.meta{color:var(--muted);font-size:12px;margin-top:5px}.mast-actions{display:flex;align-items:center;gap:12px;flex-shrink:0}.local-tag{font-size:11px;color:var(--accent);border:1px solid #c5dddf;border-radius:4px;padding:2px 7px}.navigation{display:flex;align-items:center;gap:9px;min-width:0}.nav-label{color:var(--muted);font-size:12px;white-space:nowrap}select{min-width:0;flex:1;max-width:550px;border:1px solid var(--stroke);background:var(--paper);color:var(--ink);border-radius:7px;padding:7px 11px}.nav-counter{font:12px var(--mono);color:var(--muted);white-space:nowrap}.workspace{min-height:0;display:grid;grid-template-columns:minmax(350px,.94fr) minmax(440px,1.15fr);gap:18px}.pane{min-height:0;min-width:0;background:var(--paper);border:1px solid var(--stroke);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}.pane-head{flex-shrink:0;padding:13px 21px;border-bottom:1px solid var(--stroke);display:flex;align-items:center;justify-content:space-between;gap:12px}.pane-head h2{font-size:13px;margin:0;letter-spacing:.05em}.pane-note{font-size:11px;color:var(--muted)}.scroll{min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable}.analysis{padding:25px 27px 50px}.analysis h2{font:600 25px/1.45 var(--display);margin:8px 0 12px}.question-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px}.question-number{font:600 13px var(--mono);border-left:4px solid hsl(var(--h) 42% 43%);padding-left:9px;color:var(--ink)}.category{border:1px solid var(--stroke);border-radius:4px;padding:0 5px;font-size:11px}.section-label{font-size:12px;color:var(--muted);font-weight:600;margin:24px 0 7px}.analysis p{margin:7px 0 0;white-space:pre-wrap}.question-text{background:var(--back);border-radius:7px;padding:12px 15px;line-height:1.85}.analysis ul{padding-left:20px;margin:7px 0}.analysis li{padding:3px 0}.verdict{border-left:2px solid #94bdc3;padding-left:15px}.notice{border:1px solid #e5d6ad;background:#fcf9f1;color:#725d2e;padding:10px 13px;border-radius:6px;font-size:12px;margin:17px 0}.notice p{margin:0}.notice p+p{margin-top:5px}.evidence-list{display:grid;gap:8px}.evidence{display:block;text-align:left;border-radius:6px;padding:10px 12px;background:#f8fafb;width:100%;line-height:1.7}.evidence-time{font:11px var(--mono);color:var(--accent);display:block;margin-bottom:4px}.evidence-quote{font-size:13px}.evidence-note{display:block;font-size:11px;color:var(--muted);margin-top:3px}details{border-top:1px solid var(--stroke);margin-top:24px;padding-top:15px}summary{font-size:13px;font-weight:600;cursor:pointer;list-style-position:outside;margin-left:15px}.steps{padding-left:23px}.steps strong{font-size:13px}.steps p{font-size:13px;color:var(--muted);margin-top:2px}.speech{font-size:14px;line-height:1.95;border-left:3px solid #b6ccd1;padding:0 0 0 15px;margin:12px 0 0;white-space:pre-wrap}.question-footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--stroke);margin-top:28px;padding-top:14px;font-size:11px;color:var(--muted)}.summary-lead{font:600 24px/1.5 var(--display);margin:3px 0 21px}.summary-text{font-size:14px;line-height:1.95}.overview-list{margin-top:21px;border-top:1px solid var(--stroke)}.overview-row{display:flex;align-items:center;gap:13px;width:100%;border:0;border-bottom:1px solid var(--stroke);border-radius:0;padding:13px 0;text-align:left;background:none}.overview-id{font:12px var(--mono);width:25px;flex-shrink:0;color:var(--muted)}.overview-title{flex:1}.overview-time{font:10px var(--mono);color:var(--muted)}.overview-flag{font-size:10px;color:#8c6b25}.toolbar{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--stroke);padding:8px 16px}.toolbar input{min-width:0;flex:1;border:0;background:transparent;padding:4px;font-size:12px;color:var(--ink);outline-offset:0}.toolbar button{padding:1px 7px;font-size:12px}.search-count{font-size:10px;color:var(--muted);white-space:nowrap}.transcript{padding:13px 18px 45px}.transcript-note{font-size:11px;color:var(--muted);padding:0 6px 12px}.raw-meta{font-size:11px;color:var(--muted);padding-left:8px;white-space:pre-wrap}.segment{position:relative;margin:2px 0;padding:7px 10px;border-left:3px solid transparent;border-radius:0 5px 5px 0;line-height:1.8;overflow-wrap:anywhere}.segment.linked{cursor:pointer;background:hsl(var(--h) 30% 97%);border-left-color:hsl(var(--h) 22% 83%)}.segment.linked:hover{background:hsl(var(--h) 35% 93%)}.segment.selected{background:hsl(var(--h) 48% 91%);border-left-color:hsl(var(--h) 44% 44%)}.turn-label{font-size:9px;font-weight:600;display:block;color:hsl(var(--h) 30% 35%);line-height:1.3;margin-bottom:3px;letter-spacing:.03em}.turn-label.unassigned{color:#87959a;font-weight:400}.raw-line{white-space:pre-wrap}.segment .raw-line{font-size:13px}.segment.match{outline:1px dashed #ac7927;outline-offset:-1px}.segment.current-match,.segment.pulse{outline:2px solid #ac7927;outline-offset:-1px}.source-list{font-size:12px;padding-left:18px}.mini{font-size:11px;color:var(--muted)}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}noscript{display:block;background:#fcf9f1;padding:8px}#announcement{min-height:1px}

.segment{margin:11px 0;padding:12px 14px;line-height:1.95}.turn-label{font-size:10px;margin-bottom:7px}.paragraph-body{margin:0;font-size:14px;line-height:1.95;overflow-wrap:anywhere}.source-fragment{display:inline}.fragment-time{display:none}.timestamp-mode .source-fragment{display:block;margin:3px 0}.timestamp-mode .fragment-time{display:inline;font:10px var(--mono);color:var(--muted)}.source-fragment.pulse{background:#fff0c8;outline:1px solid #ac7927;outline-offset:1px}#timestamp-toggle{white-space:nowrap;font-size:11px;padding:2px 6px}#timestamp-toggle[aria-pressed="true"]{color:var(--accent);background:#edf4f5}
@media(min-width:1600px){.app{max-width:1800px;margin:auto;padding-left:40px;padding-right:40px}.workspace{gap:24px}.analysis{padding:28px 37px 60px}.transcript{padding-left:25px;padding-right:25px}}
@media(max-width:850px){.app{padding:0 10px 10px;gap:9px}.masthead{padding-top:12px;align-items:flex-start}.masthead h1{font-size:21px}.mast-actions{gap:5px}.local-tag{display:none}.mast-actions button{font-size:11px;padding:5px 7px}.workspace{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:10px}.analysis{padding:17px 18px 35px}.analysis h2{font-size:21px}.pane-head{padding:9px 15px}.pane-note{font-size:10px}.navigation{gap:5px}.nav-label{display:none}.navigation button{padding:4px 8px;font-size:12px}select{font-size:12px}.transcript{padding:10px}.meta{font-size:10px}.eyebrow{font-size:9px}.nav-counter{font-size:10px}.toolbar{padding:5px 10px}.overview-time{display:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="app">
<header class="masthead"><div><div class="eyebrow">INTERVIEW / REVIEW</div><h1 id="title"></h1><div class="meta" id="meta"></div></div><div class="mast-actions"><span class="local-tag">离线可读</span><button id="download">下载文字稿</button></div></header>
<nav class="navigation" aria-label="题目导航"><button id="overview-button">整体评价</button><span class="nav-label">跳转至</span><label class="sr-only" for="question-select">选择问题</label><select id="question-select"></select><button id="previous" aria-label="上一题">上一题</button><button id="next" aria-label="下一题">下一题</button><span class="nav-counter" id="counter"></span></nav>
<div class="workspace">
<section class="pane" aria-label="问题与分析"><div class="pane-head"><h2>问题与分析</h2><span class="pane-note" id="analysis-note">先看整体，再逐题回顾</span></div><div class="scroll analysis" id="analysis-panel" tabindex="0"></div></section>
<section class="pane" aria-label="完整转写原文"><div class="pane-head"><h2>完整转写原文</h2><span class="pane-note" id="transcript-count"></span></div><div class="toolbar"><label class="sr-only" for="search">搜索原文</label><input id="search" type="search" placeholder="搜索原文中的词句" autocomplete="off"><span class="search-count" id="search-count"></span><button id="search-prev" aria-label="上一个搜索结果">↑</button><button id="search-next" aria-label="下一个搜索结果">↓</button><button id="timestamp-toggle" aria-pressed="false">显示时间</button></div><div class="scroll transcript" id="transcript-panel" tabindex="0"><div class="transcript-note">按发言与问答边界合并为段落。点击高亮查看分析；仅调整排版，保留原始措辞。</div><noscript>启用 JavaScript 后可使用问答关联与分析；下方原文仍完整保留。</noscript>@@RAW_ROWS@@</div></section>
</div><div class="sr-only" id="announcement" aria-live="polite"></div>
</main>
<script id="review-data" type="application/json">@@DATA@@</script>
<script id="raw-data" type="application/json">@@RAW_DATA@@</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('review-data').textContent),raw=JSON.parse(document.getElementById('raw-data').textContent);
const questions=data.questions,byId=new Map(questions.map(q=>[q.id,q])),analysis=document.getElementById('analysis-panel'),transcript=document.getElementById('transcript-panel'),select=document.getElementById('question-select');
let current=null,found=[],foundIndex=-1,pulseTimer;
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function textSection(parent,label,text,cls){parent.append(el('div','section-label',label));const p=el('p',cls,text);parent.append(p);return p}
function labelTime(clock){return clock.startsWith('00:')?clock.slice(3):clock}
function locate(id){const node=document.getElementById(id);if(!node)return;const top=node.getBoundingClientRect().top-transcript.getBoundingClientRect().top+transcript.scrollTop-64;transcript.scrollTo({top,behavior:'instant'});document.querySelectorAll('.pulse').forEach(n=>n.classList.remove('pulse'));node.classList.add('pulse');clearTimeout(pulseTimer);pulseTimer=setTimeout(()=>node.classList.remove('pulse'),1800)}
function announce(text){document.getElementById('announcement').textContent=text}
function selectQuestion(id,scrollOriginal=false){
 const q=byId.get(id);if(!q)return;current=id;select.value=id;analysis.replaceChildren();analysis.style.setProperty('--h',q.hue);
 document.querySelectorAll('.segment.selected').forEach(n=>n.classList.remove('selected'));q.segment_ids.forEach(s=>document.getElementById(s).closest('.segment').classList.add('selected'));
 const meta=el('div','question-meta');meta.append(el('span','question-number',`第 ${String(q.number).padStart(2,'0')} 题`),el('span','category',q.type||'面试问答'),el('span','',`${labelTime(q.start)}–${labelTime(q.end)}`));if(q.brief)meta.append(el('span','mini','简洁复盘'));analysis.append(meta,el('h2','',q.title));
 if(q.uncertainty?.length){const notice=el('div','notice');notice.append(el('strong','','本题待核'));q.uncertainty.forEach(t=>notice.append(el('p','',t)));analysis.append(notice)}
 textSection(analysis,'提取的问题 · 整理转述',q.question,'question-text');analysis.append(el('div','section-label','实际回答 · 忠实概括'));const ul=el('ul');q.answer.forEach(t=>ul.append(el('li','',t)));analysis.append(ul);textSection(analysis,'评价',q.evaluation,'verdict');
 if(q.evidence?.length){analysis.append(el('div','section-label','原文证据 · 点击定位'));const evs=el('div','evidence-list');q.evidence.forEach(ev=>{const b=el('button','evidence');b.append(el('span','evidence-time',`${ev.time} ↗ 原文`),el('span','evidence-quote',`“${ev.quote}”`));if(ev.note)b.append(el('span','evidence-note',ev.note));b.addEventListener('click',()=>{locate(ev.segment_id);announce(`已定位至 ${ev.time} 原文`)});evs.append(b)});analysis.append(evs)}
 const details=el('details');details.append(el('summary','','推荐答法与面试总结话术'));const ol=el('ol','steps');q.steps.forEach(s=>{const li=el('li');li.append(el('strong','',s.title),el('p','',s.body));ol.append(li)});details.append(ol,el('div','section-label','面试总结话术 · 建议表达'),el('blockquote','speech',q.speech));analysis.append(details);
 if(q.sources?.length){analysis.append(el('div','section-label','核对资料'));const ul=el('ul','source-list');q.sources.forEach(s=>{const li=el('li'),a=el('a','',s.label);a.href=s.url;a.target='_blank';a.rel='noopener noreferrer';li.append(a);ul.append(li)});analysis.append(ul)}
 const footer=el('div','question-footer');footer.append(el('span','',`关联 ${q.segment_ids.length} 个转写片段`));const b=el('button','','定位本题开头');b.addEventListener('click',()=>locate(q.segment_ids[0]));footer.append(b);analysis.append(footer);analysis.scrollTop=0;
 document.getElementById('analysis-note').textContent='原文、实际回答与建议表达分开呈现';updateNavigation();if(scrollOriginal)locate(q.segment_ids[0]);announce(`已显示第 ${q.number} 题：${q.title}`)
}
function showOverview(){current=null;select.value='overview';analysis.replaceChildren(el('div','eyebrow','SESSION TAKEAWAY'),el('h2','summary-lead','整体评价'));const summary=el('div','summary-text');data.summary.forEach(t=>summary.append(el('p','',t)));analysis.append(summary);if(data.scope_note)analysis.append(el('p','mini',data.scope_note));const list=el('div','overview-list');questions.forEach(q=>{const b=el('button','overview-row');b.append(el('span','overview-id',String(q.number).padStart(2,'0')),el('span','overview-title',q.title));if(q.uncertainty?.length)b.append(el('span','overview-flag','待核'));b.append(el('span','overview-time',labelTime(q.start)));b.addEventListener('click',()=>selectQuestion(q.id,true));list.append(b)});analysis.append(list);analysis.scrollTop=0;document.querySelectorAll('.segment.selected').forEach(n=>n.classList.remove('selected'));document.getElementById('analysis-note').textContent=`${questions.length} 题 · 可从原文或题目进入`;updateNavigation()}
function updateNavigation(){const i=questions.findIndex(q=>q.id===current);document.getElementById('previous').disabled=i<=0;document.getElementById('next').disabled=i===questions.length-1;document.getElementById('counter').textContent=i<0?`${questions.length} 题`:`${i+1} / ${questions.length}`}
function nextQuestion(delta){const i=questions.findIndex(q=>q.id===current),j=i<0?0:i+delta;if(questions[j])selectQuestion(questions[j].id,true)}
function search(){const value=document.getElementById('search').value.trim().toLocaleLowerCase();document.querySelectorAll('.match,.current-match').forEach(n=>n.classList.remove('match','current-match'));found=value?[...document.querySelectorAll('.segment')].filter(n=>[...n.querySelectorAll('.fragment-text')].map(s=>s.textContent).join('').toLocaleLowerCase().includes(value)):[];found.forEach(n=>n.classList.add('match'));foundIndex=-1;document.getElementById('search-count').textContent=value?`${found.length} 处段落`:'';document.getElementById('search-prev').disabled=!found.length;document.getElementById('search-next').disabled=!found.length;if(found.length)moveSearch(1)}
function moveSearch(delta){if(!found.length)return;found.forEach(n=>n.classList.remove('current-match'));foundIndex=(foundIndex+delta+found.length)%found.length;const node=found[foundIndex];node.classList.add('current-match');locate(node.id);document.getElementById('search-count').textContent=`${foundIndex+1} / ${found.length}`}
document.getElementById('title').textContent=data.title+'｜面试复盘';const duration=data.duration?`${Math.floor(Number(data.duration)/60)} 分 ${Math.round(Number(data.duration)%60)} 秒`:'录音复盘';document.getElementById('meta').textContent=`${data.date} · ${data.audio} · ${duration}`;document.getElementById('transcript-count').textContent=`${data.paragraph_count} 个自然段 · 全文保留`;
select.append(new Option('整体评价','overview'));questions.forEach(q=>select.append(new Option(`${String(q.number).padStart(2,'0')}  ${q.title}`,q.id)));select.addEventListener('change',()=>select.value==='overview'?showOverview():selectQuestion(select.value,true));document.getElementById('overview-button').addEventListener('click',showOverview);document.getElementById('previous').addEventListener('click',()=>nextQuestion(-1));document.getElementById('next').addEventListener('click',()=>nextQuestion(1));
transcript.addEventListener('click',event=>{const node=event.target.closest('.segment.linked');if(node)selectQuestion(node.dataset.q,false)});transcript.addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&event.target.matches('.segment.linked')){event.preventDefault();selectQuestion(event.target.dataset.q,false)}});
document.getElementById('search').addEventListener('input',search);document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();moveSearch(e.shiftKey?-1:1)}});document.getElementById('search-prev').addEventListener('click',()=>moveSearch(-1));document.getElementById('search-next').addEventListener('click',()=>moveSearch(1));

document.getElementById('timestamp-toggle').addEventListener('click',()=>{const button=document.getElementById('timestamp-toggle'),box=transcript.getBoundingClientRect(),anchor=[...transcript.querySelectorAll('.source-fragment')].find(n=>n.getBoundingClientRect().bottom>=box.top+10),before=anchor?.getBoundingClientRect().top;const visible=transcript.classList.toggle('timestamp-mode');button.setAttribute('aria-pressed',String(visible));button.textContent=visible?'段落阅读':'显示时间';if(anchor)transcript.scrollTop+=anchor.getBoundingClientRect().top-before;announce(visible?'已显示逐句时间':'已切换到自然段落阅读')});
document.getElementById('download').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([raw],{type:'text/plain;charset=utf-8'})),a=el('a');a.href=url;a.download='文字稿.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});search();showOverview();
</script>
</body>
</html>
