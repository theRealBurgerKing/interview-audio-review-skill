<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>@@PAGE_TITLE@@</title>
<style>
:root{--ink:#19343d;--muted:#637780;--accent:#176a70;--stroke:#dce4e7;--paper:#fff;--back:#fff;--surface:#f2f5f6;--display:"Songti SC","STSong",serif;--body:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;--mono:"SFMono-Regular",Consolas,monospace;color-scheme:light}
*{box-sizing:border-box}body{margin:0;background:var(--back);color:var(--ink);font:14px/1.75 var(--body)}button,input{font:inherit}button{cursor:pointer}button{color:inherit}button:disabled{cursor:default;opacity:.4}button:focus-visible,input:focus-visible,a:focus-visible,.segment:focus-visible,summary:focus-visible{outline:3px solid #207c99;outline-offset:3px}button{border:1px solid var(--stroke);border-radius:7px;background:var(--paper);padding:6px 11px}button:hover:not(:disabled){background:#edf4f5}a{color:var(--accent);text-underline-offset:3px}.app{position:relative;height:100dvh;display:grid;grid-template-columns:224px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);padding:0 24px 18px 0;gap:18px 26px;overflow:hidden}.sidebar{grid-column:1;grid-row:1 / -1;min-height:0;display:flex;flex-direction:column;justify-content:center;background:var(--paper);padding:18px 0}.contents{width:100%;height:auto;max-height:100%;min-height:0;border:0;margin:0;padding:0}.contents>summary{display:none}.contents-list{height:auto;max-height:calc(100dvh - 54px);overflow:auto;overscroll-behavior:contain;padding:0 12px}.contents-item{display:block;width:100%;border:0;border-radius:3px;background:transparent;text-align:left;padding:6px 10px;color:#747d85;font-size:13px;line-height:1.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.contents-item:hover:not(:disabled){background:#f5f7fa;color:var(--ink)}.contents-item[aria-current="page"],.contents-item[aria-current="page"]:hover{color:#315eff}.contents-overview{margin-bottom:7px}.contents-item:focus-visible{outline-offset:-3px}.masthead{grid-column:2;grid-row:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:20px}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--accent);font-weight:700}.masthead h1{font:600 26px/1.3 var(--display);margin:4px 0 0}.meta{color:var(--muted);font-size:12px;margin-top:5px}.masthead>div{min-width:0}.storage-location{overflow-wrap:anywhere}.workspace{grid-column:2;grid-row:2;min-height:0;min-width:0;display:grid;grid-template-columns:minmax(350px,.94fr) minmax(440px,1.15fr);gap:18px}.pane{min-height:0;min-width:0;background:var(--paper);border:1px solid var(--stroke);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}.pane-head{flex-shrink:0;padding:13px 21px;border-bottom:1px solid var(--stroke);display:flex;align-items:center;justify-content:space-between;gap:12px}.pane-head h2{font-size:13px;margin:0;letter-spacing:.05em}.pane-note{font-size:11px;color:var(--muted)}.scroll{min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable}.analysis{padding:25px 27px 50px}.analysis h2{font:600 25px/1.45 var(--display);margin:8px 0 12px}.question-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px}.question-number{font:600 13px var(--mono);border-left:4px solid hsl(var(--h) 42% 43%);padding-left:9px;color:var(--ink)}.category{border:1px solid var(--stroke);border-radius:4px;padding:0 5px;font-size:11px}.section-label{font-size:12px;color:var(--muted);font-weight:600;margin:24px 0 7px}.analysis p{margin:7px 0 0;white-space:pre-wrap}.question-text{background:var(--surface);border-radius:7px;padding:12px 15px;line-height:1.85}.analysis ul{padding-left:20px;margin:7px 0}.analysis li{padding:3px 0}.verdict{border-left:2px solid #94bdc3;padding-left:15px}.notice{border:1px solid #e5d6ad;background:#fcf9f1;color:#725d2e;padding:10px 13px;border-radius:6px;font-size:12px;margin:17px 0}.notice p{margin:0}.notice p+p{margin-top:5px}details{border-top:1px solid var(--stroke);margin-top:24px;padding-top:15px}summary{font-size:13px;font-weight:600;cursor:pointer;list-style-position:outside;margin-left:15px}.steps{padding-left:23px}.steps strong{font-size:13px}.steps p{font-size:13px;color:var(--muted);margin-top:2px}.speech{font-size:14px;line-height:1.95;border-left:3px solid #b6ccd1;padding:0 0 0 15px;margin:12px 0 0;white-space:pre-wrap}.summary-lead{font:600 24px/1.5 var(--display);margin:3px 0 21px}.summary-text{font-size:14px;line-height:1.95}.overview-list{margin-top:21px;border-top:1px solid var(--stroke)}.overview-row{display:flex;align-items:center;gap:13px;width:100%;border:0;border-bottom:1px solid var(--stroke);border-radius:0;padding:13px 0;text-align:left;background:none}.overview-id{font:12px var(--mono);width:25px;flex-shrink:0;color:var(--muted)}.overview-title{flex:1}.overview-time{font:10px var(--mono);color:var(--muted)}.overview-flag{font-size:10px;color:#8c6b25}.toolbar{flex-shrink:0;padding:10px 18px 8px}.search-field{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px 0 11px;border:1px solid #ededed;border-radius:8px;background:#f6f6f6}.search-field:focus-within{border-color:#bdbdbd;background:#fff}.search-icon{width:14px;height:14px;flex-shrink:0;color:#999}.toolbar input{min-width:0;flex:1;width:0;height:100%;border:0;border-radius:0;box-shadow:none;background:transparent;padding:0;font-size:12px;line-height:normal;color:#333;appearance:none}.toolbar input:focus-visible{outline:none}.toolbar input::placeholder{color:#999}.toolbar input::-webkit-search-cancel-button{display:none;-webkit-appearance:none}.toolbar button[hidden]{display:none}#search-clear{flex-shrink:0}.search-actions{display:flex;align-items:center;gap:0;flex-shrink:0}.toolbar button{display:grid;place-items:center;width:25px;height:25px;padding:0;border:0;border-radius:5px;background:transparent;color:#777}.toolbar button:hover:not(:disabled){background:#e8e8e8;color:#333}.toolbar button:focus-visible{outline:2px solid #777;outline-offset:-2px}.toolbar button svg{width:14px;height:14px}.search-count{font-size:11px;color:#888;white-space:nowrap;font-variant-numeric:tabular-nums}.search-count:empty{display:none}.transcript{padding:13px 18px 45px}.transcript-note{font-size:11px;color:var(--muted);padding:0 6px 12px}.raw-meta{font-size:11px;color:var(--muted);padding-left:8px;white-space:pre-wrap}.segment{position:relative;margin:2px 0;padding:7px 10px;border-left:3px solid transparent;border-radius:0 5px 5px 0;line-height:1.8;overflow-wrap:anywhere}.segment{background:var(--turn-background,#f4f4f4);border-left-color:var(--turn-edge,#dedede);color:#73797e}.segment.linked{color:#374047}.segment[data-tone="dark"]{--turn-background:#e4edf9;--selected-background:#d5e3f6;--turn-edge:#9fb8d8}.segment[data-tone="light"]{--turn-background:#eef4fc;--selected-background:#e5eefb;--turn-edge:#cbdcf0}.segment.linked{cursor:pointer}.segment.linked:hover{border-left-color:#6484ac}.segment.selected{background:var(--selected-background,#e5eefb);border-left-color:#6484ac;outline:2px solid #6484ac;outline-offset:-2px;box-shadow:inset 3px 0 0 #6484ac;color:#2e3940}.segment.selected .turn-label{color:#6484ac;font-weight:700}.segment:focus-visible{outline-color:#6484ac}.turn-label{font-size:9px;font-weight:600;display:block;color:#6484ac;line-height:1.3;margin-bottom:3px;letter-spacing:.03em}.turn-label.unassigned{color:#8a8f93;font-weight:400}.raw-line{white-space:pre-wrap}.segment .raw-line{font-size:13px}.segment.pulse{outline:2px solid #6484ac;outline-offset:-1px}.search-hit{background:#fff59d;color:#111;border-radius:2px;padding:0}.search-hit.current-hit{background:#ffd54f;color:#111;outline:1px solid #b48a00;outline-offset:1px}.source-list{font-size:12px;padding-left:18px}.mini{font-size:11px;color:var(--muted)}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}noscript{display:block;background:#fcf9f1;padding:8px}#announcement{min-height:1px}

.segment{margin:11px 0;padding:12px 14px;line-height:1.95}.turn-label{font-size:11px;margin-bottom:7px}.paragraph-body{margin:0;font-size:14px;line-height:1.95;overflow-wrap:anywhere}.source-fragment{display:inline}.fragment-time{display:none}.source-fragment.pulse{background:transparent;outline:1px solid #6484ac;outline-offset:1px}
@media(min-width:1600px){.app{max-width:1920px;margin:auto;grid-template-columns:248px minmax(0,1fr);padding-right:32px}.workspace{gap:24px}.analysis{padding:28px 37px 60px}.transcript{padding-left:25px;padding-right:25px}}
@media(max-width:1200px){.app{grid-template-columns:190px minmax(0,1fr);gap:16px 18px;padding-right:18px}.workspace{grid-template-columns:minmax(0,.94fr) minmax(0,1.15fr);gap:12px}.analysis{padding:20px}.pane-head{padding:12px 15px}.pane-note{font-size:10px}.transcript{padding:12px}.toolbar{padding:8px 10px}}
@media(max-width:1000px){.workspace{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr)}}
@media(max-width:850px){.app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);padding:0 10px 10px;gap:9px}.masthead{grid-column:1;grid-row:1;padding-top:12px;align-items:flex-start}.masthead h1{font-size:21px}.sidebar{grid-column:1;grid-row:2;padding:0;background:var(--paper);border:1px solid var(--stroke);border-radius:7px;overflow:hidden}.contents{height:auto}.contents>summary{display:list-item;list-style-position:inside;margin:0;padding:6px 11px;font-size:12px;font-weight:500}.contents-list{height:auto;max-height:26dvh;padding:0 6px 6px}.contents-item{font-size:12px;padding:5px 8px}.workspace{grid-column:1;grid-row:3;gap:10px}.analysis{padding:17px 18px 35px}.analysis h2{font-size:21px}.pane-head{padding:9px 15px}.pane-note{font-size:10px}.transcript{padding:10px}.meta{font-size:10px;overflow-wrap:anywhere}.eyebrow{font-size:9px}.toolbar{padding:5px 10px}.overview-time{display:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="app">
<header class="masthead"><div><h1 id="title"></h1><div class="meta" id="meta"></div><div class="meta storage-location" id="storage-location"></div></div></header>
<aside class="sidebar"><details class="contents" id="contents" open><summary>目录</summary><nav class="contents-list" id="question-list" aria-label="题目目录"></nav></details></aside>
<div class="workspace">
<section class="pane" aria-label="问题与分析"><div class="pane-head"><h2>问题与分析</h2><span class="pane-note" id="analysis-note">先看整体，再逐题回顾</span></div><div class="scroll analysis" id="analysis-panel" tabindex="0"></div></section>
<section class="pane" aria-label="完整转写原文"><div class="pane-head"><h2>完整转写原文</h2><span class="pane-note" id="transcript-count"></span></div><div class="toolbar"><div class="search-field"><svg class="search-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m12.5 12.5 4 4" stroke-linecap="round"/></svg><label class="sr-only" for="search">搜索原文</label><input id="search" type="search" placeholder="搜索原文…" autocomplete="off"><button id="search-clear" type="button" aria-label="清空搜索" hidden><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15" stroke-linecap="round"/></svg></button><span class="search-count" id="search-count"></span><div class="search-actions"><button id="search-prev" aria-label="上一个搜索结果"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m5 12 5-5 5 5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button id="search-next" aria-label="下一个搜索结果"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m5 8 5 5 5-5" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div></div><div class="scroll transcript" id="transcript-panel" tabindex="0"><noscript>启用 JavaScript 后可使用问答关联与分析；下方原文仍完整保留。</noscript>@@RAW_ROWS@@</div></section>
</div><div class="sr-only" id="announcement" aria-live="polite"></div>
</main>
<script id="review-data" type="application/json">@@DATA@@</script>
<script id="raw-data" type="application/json">@@RAW_DATA@@</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('review-data').textContent),raw=JSON.parse(document.getElementById('raw-data').textContent);
const questions=data.questions,byId=new Map(questions.map(q=>[q.id,q])),analysis=document.getElementById('analysis-panel'),transcript=document.getElementById('transcript-panel'),questionList=document.getElementById('question-list'),contents=document.getElementById('contents'),compact=matchMedia('(max-width:850px)');
let current=null,found=[],foundIndex=-1,pulseTimer;
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function textSection(parent,label,text,cls){parent.append(el('div','section-label',label));const p=el('p',cls,text);parent.append(p);return p}
function labelTime(clock){return clock.startsWith('00:')?clock.slice(3):clock}
function locate(target){const node=typeof target==='string'?document.getElementById(target):target;if(!node)return;const top=node.getBoundingClientRect().top-transcript.getBoundingClientRect().top+transcript.scrollTop-64;transcript.scrollTo({top,behavior:'instant'});document.querySelectorAll('.pulse').forEach(n=>n.classList.remove('pulse'));node.classList.add('pulse');clearTimeout(pulseTimer);pulseTimer=setTimeout(()=>node.classList.remove('pulse'),1800)}
function announce(text){document.getElementById('announcement').textContent=text}
function selectQuestion(id,scrollOriginal=false){
 const q=byId.get(id);if(!q)return;current=id;analysis.replaceChildren();analysis.style.setProperty('--h',q.hue);
 document.querySelectorAll('.segment.selected').forEach(n=>n.classList.remove('selected'));transcript.querySelectorAll('.segment[data-q="'+q.id+'"]').forEach(n=>n.classList.add('selected'));
 const meta=el('div','question-meta');meta.append(el('span','question-number',`第 ${String(q.number).padStart(2,'0')} 题`),el('span','category',q.type||'面试问答'),el('span','',`${labelTime(q.start)}–${labelTime(q.end)}`));if(q.brief)meta.append(el('span','mini','简洁复盘'));analysis.append(meta,el('h2','',q.title));
 if(q.uncertainty?.length){const notice=el('div','notice');notice.append(el('strong','','本题待核'));q.uncertainty.forEach(t=>notice.append(el('p','',t)));analysis.append(notice)}
 textSection(analysis,'问题',q.question,'question-text');analysis.append(el('div','section-label','我的回复'));const ul=el('ul');q.answer.forEach(t=>ul.append(el('li','',t)));analysis.append(ul);textSection(analysis,'评价',q.evaluation,'verdict');
 analysis.append(el('div','section-label','推荐回答要点'));const ol=el('ol','steps');q.steps.forEach(s=>{const li=el('li');li.append(el('strong','',s.title),el('p','',s.body));ol.append(li)});analysis.append(ol,el('div','section-label','推荐回答'),el('blockquote','speech',q.speech));
 if(q.sources?.length){analysis.append(el('div','section-label','核对资料'));const ul=el('ul','source-list');q.sources.forEach(s=>{const li=el('li'),a=el('a','',s.label);a.href=s.url;a.target='_blank';a.rel='noopener noreferrer';li.append(a);ul.append(li)});analysis.append(ul)}
 analysis.scrollTop=0;
 document.getElementById('analysis-note').textContent='';updateNavigation();if(scrollOriginal)locate(q.segment_ids[0]);announce(`已显示第 ${q.number} 题：${q.title}`)
}
function showOverview(){current=null;analysis.replaceChildren(el('h2','summary-lead','整体评价'));const summary=el('div','summary-text');data.summary.forEach(t=>summary.append(el('p','',t)));analysis.append(summary);analysis.scrollTop=0;document.querySelectorAll('.segment.selected').forEach(n=>n.classList.remove('selected'));document.getElementById('analysis-note').textContent=`${questions.length} 题`;updateNavigation()}
function updateNavigation(){const view=current||'overview';questionList.querySelectorAll('.contents-item').forEach(button=>{if(button.dataset.view===view)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current')});const active=questionList.querySelector('[aria-current="page"]');if(active){const box=questionList.getBoundingClientRect(),item=active.getBoundingClientRect();if(item.top<box.top)questionList.scrollTop+=item.top-box.top;else if(item.bottom>box.bottom)questionList.scrollTop+=item.bottom-box.bottom}}
function navigate(view){if(view==='overview')showOverview();else selectQuestion(view,true);if(compact.matches)contents.open=false}
function search(){
 const input=document.getElementById('search'),value=input.value.trim();document.getElementById('search-clear').hidden=input.value.length===0;found=[];foundIndex=-1;
 transcript.querySelectorAll('.fragment-text').forEach(node=>{node.textContent=node.textContent});
 if(value){
  const pattern=new RegExp(value.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'giu');
  transcript.querySelectorAll('.paragraph-body').forEach(paragraph=>{
   let text='';const parts=[];
   paragraph.childNodes.forEach(child=>{
    if(child.nodeType===Node.TEXT_NODE){text+=child.textContent;return}
    const node=child.querySelector('.fragment-text');if(!node)return;
    const content=node.textContent;parts.push({node,text:content,start:text.length});text+=content;
   });
   const matches=[...text.matchAll(pattern)].map(match=>{
    const hit={start:match.index,end:match.index+match[0].length,index:found.length,marks:[]};found.push(hit);return hit;
   });
   parts.forEach(part=>{
    let cursor=0;const content=document.createDocumentFragment();
    matches.forEach(hit=>{
     const start=Math.max(0,hit.start-part.start),end=Math.min(part.text.length,hit.end-part.start);if(start>=end)return;
     content.append(document.createTextNode(part.text.slice(cursor,start)));
     const mark=el('mark','search-hit',part.text.slice(start,end));mark.dataset.matchIndex=hit.index;
     content.append(mark);hit.marks.push(mark);cursor=end;
    });
    content.append(document.createTextNode(part.text.slice(cursor)));part.node.replaceChildren(content);
   });
  });
 }
 document.getElementById('search-count').textContent=value?`${found.length} 处`:'';
 document.getElementById('search-prev').disabled=!found.length;document.getElementById('search-next').disabled=!found.length;
 if(found.length)moveSearch(1);
}
function moveSearch(delta){
 if(!found.length)return;transcript.querySelectorAll('.search-hit.current-hit').forEach(node=>node.classList.remove('current-hit'));
 foundIndex=(foundIndex+delta+found.length)%found.length;const hit=found[foundIndex];hit.marks.forEach(node=>node.classList.add('current-hit'));
 locate(hit.marks[0]);document.getElementById('search-count').textContent=`${foundIndex+1} / ${found.length}`;
 announce(`搜索结果 ${foundIndex+1} / ${found.length}`);
}
document.getElementById('title').textContent=data.title+'｜面试复盘';const duration=data.duration_seconds?`约 ${Math.max(1,Math.round(data.duration_seconds/60))} 分钟`:'未提供';document.getElementById('meta').textContent=`录音时间：${data.recorded_at_display||'未提供'} · 时长：${duration}`;document.getElementById('storage-location').textContent=`文件存储位置：${data.storage_path||'未提供'}`;document.getElementById('transcript-count').textContent=`${data.paragraph_count} 个自然段`;
const overview=el('button','contents-item contents-overview',data.title);overview.type='button';overview.dataset.view='overview';overview.title=data.title+' · 整体评价';overview.setAttribute('aria-label',data.title+' · 整体评价');overview.addEventListener('click',()=>navigate('overview'));questionList.append(overview);questions.forEach(q=>{const label=`Q${q.number} ${q.title}`,button=el('button','contents-item',label);button.type='button';button.dataset.view=q.id;button.title=label;button.addEventListener('click',()=>navigate(q.id));questionList.append(button)});contents.open=!compact.matches;compact.addEventListener('change',()=>{contents.open=!compact.matches});
transcript.addEventListener('click',event=>{const node=event.target.closest('.segment.linked');if(node)selectQuestion(node.dataset.q,false)});transcript.addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&event.target.matches('.segment.linked')){event.preventDefault();selectQuestion(event.target.dataset.q,false)}});
document.getElementById('search-clear').addEventListener('click',()=>{const input=document.getElementById('search');input.value='';search();input.focus()});document.getElementById('search').addEventListener('input',search);document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();moveSearch(e.shiftKey?-1:1)}});document.getElementById('search-prev').addEventListener('click',()=>moveSearch(-1));document.getElementById('search-next').addEventListener('click',()=>moveSearch(1));

search();showOverview();
</script>
</body>
</html>
